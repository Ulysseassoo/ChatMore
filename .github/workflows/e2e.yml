name: Tests de bout en bout

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    name: Playwright contre Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Démarrer Supabase (avec Mailpit pour les e-mails)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor

      - name: Variables d'environnement locales
        run: |
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLIC_KEY=$PUBLISHABLE_KEY"
          } > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
